<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cassette Cabin</title>
    <meta name="description" content="A cozy, pastel-beige music streaming, playlist sharing, creator profile, and encrypted real-time community." />
    <meta property="og:title" content="Cassette Cabin" />
    <meta property="og:description" content="A cozy, pastel-beige music streaming, playlist sharing, creator profile, and encrypted real-time community." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Ignore Vite HMR / dev client WebSocket disconnection errors per environment constraints
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message?.includes('WebSocket') ||
          event.reason.name === 'SendBeforeConnectError' ||
          String(event.reason).includes('WebSocket') ||
          String(event.reason?.stack).includes('createWebSocketModuleRunnerTransport')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event.message?.includes('WebSocket') ||
          event.filename?.includes('@vite/client') ||
          String(event.error?.stack).includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
